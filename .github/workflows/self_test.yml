name: PhoenixOS Self-Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

  mcp-tests:
    name: MCP TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install MCP deps
        run: cd packages/mcp && pnpm install --ignore-scripts

      - name: Run MCP tests
        run: cd packages/mcp && pnpm test

  integration:
    name: Integration — PhoenixOS evaluates its own PR
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start PhoenixOS API
        run: |
          PYTHONPATH=packages uv run uvicorn core.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health || exit 1
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_AUTH: none
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          SQLITE_PATH: /tmp/phoenix_test.db

      - name: Trigger synthetic failure webhook
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8000/api/webhooks/github \
            -H "Content-Type: application/json" \
            -d '{
              "action": "completed",
              "workflow_run": {
                "id": "self-test-001",
                "name": "CI",
                "head_branch": "main",
                "conclusion": "failure",
                "head_sha": "abc1234567890",
                "created_at": "2026-05-31T00:00:00Z",
                "updated_at": "2026-05-31T00:00:00Z",
                "html_url": "https://github.com/test/repo/actions/runs/1"
              },
              "repository": {"full_name": "test/repo"}
            }')
          echo "Webhook response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'event_id' in d, 'Missing event_id'"

      - name: Run eval on a prepared diff
        run: |
          DIFF=$(cat << 'EOF'
          diff --git a/src/auth.py b/src/auth.py
          --- a/src/auth.py
          +++ b/src/auth.py
          @@ -10,6 +10,7 @@ def validate_token(token: str) -> bool:
               decoded = jwt.decode(token, SECRET_KEY, algorithms=["HS256"])
          +    log.info(f"Token validated for user {decoded['sub']}")
               return True
          EOF
          )

          RESPONSE=$(curl -sf -X POST http://localhost:8000/api/evals/run \
            -H "Content-Type: application/json" \
            -d "{\"diff\": $(echo "$DIFF" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}")

          echo "Eval response: $RESPONSE"

          python3 << 'PYEOF'
          import sys, json, subprocess
          result = subprocess.run(
              ["curl", "-sf", "-X", "POST", "http://localhost:8000/api/evals/run",
               "-H", "Content-Type: application/json",
               "-d", '{"diff": "diff --git a/src/auth.py b/src/auth.py\\n+    return True"}'],
              capture_output=True, text=True
          )
          d = json.loads(result.stdout)
          assert "trust_score" in d, f"Missing trust_score in: {d}"
          assert "verdict" in d, f"Missing verdict in: {d}"
          assert d["verdict"] in ("pass", "warn", "block"), f"Invalid verdict: {d['verdict']}"
          print(f"PASS: trust_score={d['trust_score']}, verdict={d['verdict']}")
          PYEOF

      - name: Check fragility endpoint
        run: |
          curl -sf http://localhost:8000/api/graph/fragility \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Signatures in graph: {len(d)}')"
