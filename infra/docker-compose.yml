services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  core:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../packages/core:/app/packages/core
    env_file:
      - ../.env
    environment:
      # These override anything in .env so the container talks to the neo4j
      # service (not localhost) and writes the DB inside the container.
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_AUTH=none
      - SQLITE_PATH=/app/data/phoenix.db
    depends_on:
      neo4j:
        condition: service_healthy
    command: uv run uvicorn core.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  neo4j_data:
